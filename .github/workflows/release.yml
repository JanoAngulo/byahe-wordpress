name: Release demo build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the publish job, which runs no project code, can write.
permissions:
  contents: read

# Queue rather than cancel, so a newer push never interrupts an upload half way.
concurrency:
  group: release-demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer

      - name: Install
        run: |
          npm ci
          composer install --no-interaction --no-progress

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build:wp

      - name: Zip theme and plugin
        run: npm run package:wp

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-zips
          path: dist/zips/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-zips
          path: zips

      - name: Publish to the demo-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view demo-latest || gh release create demo-latest --title "Demo build" --notes "Rolling build used by the Playground demo." --prerelease
          gh release upload demo-latest zips/byahe-theme.zip zips/byahe-core.zip --clobber
